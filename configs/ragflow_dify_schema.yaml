# RAGFlow / Dify 生产级入库与检索配置建议
knowledge_base_name: robotic_assembly_1985_2025
languages:
  - zh
  - en

chunking:
  strategy: parent_child
  parent_delimiter: "\n## "
  child_chunk_tokens: 500
  child_overlap_tokens: 80
  preserve_markdown_tables: true
  preserve_latex_equations: true
  preserve_code_blocks: true

metadata_schema:
  - name: book_id
    type: string
    values: [book2025, book1985, cross_era_glossary, cross_era_synthesis]
  - name: year
    type: string
    values: ["1985", "2025", "1985-2025"]
  - name: section_title
    type: string
  - name: domain_tags
    type: array_string
    values:
      - sensing
      - sim2real
      - compliance_control
      - pih_mechanics
      - learning_rl
      - dfa_design
      - programming
      - robots_systems
      - economics
  - name: content_type
    type: string
    values: [text, table, formula_text, algorithm]

retrieval:
  mode: hybrid
  lexical_engine: bm25
  lexical_weight: 0.35
  dense_embedding_model: BAAI/bge-m3
  dense_weight: 0.65
  top_k_candidates: 20
  reranker_model: BAAI/bge-reranker-v2-m3
  top_k_final: 5
  score_threshold: 0.25
  parent_context_expansion: true
